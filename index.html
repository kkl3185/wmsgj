<!DOCTYPE html>
<html lang="zh-CN" data-theme="choco">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>针织帽 · 生活工作台</title>
<meta name="theme-color" content="#6B4A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="针织帽">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root {
    --bg: #F3ECE4;
    --sidebar: #FBF6F0;
    --card: #FFFFFF;
    --ink: #4A3F36;
    --muted: #9C8B7B;
    --line: #E9DED2;
    --brand: #B07A4E;
    --brand-2: #C99A6E;
    --brand-soft: #F2E7DA;
    --green: #7E9B6E;
    --pink: #D6A0A8;
    --amber: #D9A24E;
    --shadow: 0 10px 28px rgba(120,90,60,.14);
    --glow: rgba(176,122,78,.32);
    --tint: #F8F1E9;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 100% 0%, var(--brand-soft) 0%, var(--bg) 55%);
    color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; overflow: hidden; }
  /* ===== 侧边栏 ===== */
  .sidebar {
    width: 248px; flex-shrink: 0; background: var(--sidebar);
    border-right: 1px solid var(--line); padding: 26px 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 4px 10px 22px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 13px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    display: grid; place-items: center; color: #fff; font-size: 21px;
    box-shadow: 0 6px 14px var(--glow);
  }
  .brand .name { font-size: 19px; font-weight: 800; letter-spacing: 1px; color: var(--ink); }
  .nav-item {
    position: relative; display: flex; align-items: center; gap: 13px;
    padding: 13px 15px; border-radius: 13px; cursor: pointer;
    color: var(--muted); font-size: 15px; font-weight: 600; transition: .18s; user-select: none;
  }
  .nav-item:hover { background: var(--bg); color: var(--ink); }
  .nav-item.active { background: var(--brand-soft); color: var(--brand); }
  .nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 4px; height: 22px; border-radius: 0 4px 4px 0; background: linear-gradient(var(--brand), var(--brand-2));
  }
  .nav-item .emoji { font-size: 20px; width: 24px; text-align: center; }
  .nav-item .badge {
    margin-left: auto; font-size: 12px; background: var(--brand);
    color: #fff; border-radius: 20px; padding: 1px 8px; display: none;
  }
  .nav-item .badge.show { display: inline-block; }
  .sidebar .foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px; line-height: 1.5; }
  /* ===== 主区域 ===== */
  .main { flex: 1; overflow-y: auto; padding: 34px 44px 64px; }
  .section { display: none; animation: fade .3s ease; }
  .section.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .sec-head { margin-bottom: 24px; }
  .sec-head h1 { font-size: 26px; margin: 0 0 6px; font-weight: 800; letter-spacing: .5px; }
  .sec-head p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow);
    margin-bottom: 22px; transition: box-shadow .2s;
  }
  .card:hover { box-shadow: 0 12px 34px rgba(120, 90, 60, .13); }
  .card h2 { font-size: 17px; margin: 0 0 16px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; font-weight: 700; }
  .card h2::before {
    content: ""; width: 8px; height: 8px; border-radius: 3px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
  }
  .card h2 .tag { font-size: 12px; font-weight: 500; color: var(--muted); }
  /* ===== 卡片可折叠（点标题展开/合上）===== */
  .card-head { cursor: pointer; user-select: none; display:flex;align-items:center;gap:8px; }
  .caret { margin-left: auto; font-size: 13px; color: var(--muted); transition: transform .2s; flex-shrink: 0; }
  .card.collapsed > *:not(.card-head),
  .home-block.collapsed > *:not(.card-head),
  .home-anni.collapsed > *:not(.card-head) { display: none !important; }
  .collapsed .caret { transform: rotate(-90deg); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  input[type=text], input[type=time], input[type=date], input[type=month], input[type=datetime-local], input[type=file],
  input[type=number], textarea, select {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: 11px; font-size: 14px; font-family: inherit; color: var(--ink);
    background: var(--tint); outline: none; transition: .18s;
  }
  input[type=file] { padding: 9px; }
  input:focus, textarea:focus, select:focus { border-color: var(--brand); background: var(--card); box-shadow: 0 0 0 4px var(--brand-soft); }
  textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 0 16px; line-height: 1.5; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  .row > .field { flex: 1; min-width: 140px; }
  .row > .field.field-btn { flex: 0 0 auto; min-width: 0; width: auto; }
  .btn-row { display: flex; align-items: center; gap: 8px; }
  .input-with-btn { display: flex; gap: 8px; align-items: center; }
  .input-with-btn > input, .input-with-btn > select { flex: 1; min-width: 0; width: auto; }
  .input-with-btn > button { flex-shrink: 0; white-space: nowrap; }
  button {
    cursor: pointer; border: none; border-radius: 11px; font-family: inherit;
    font-size: 14px; font-weight: 700; padding: 11px 20px; transition: .18s;
  }
  .btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 6px 16px var(--glow); }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 9px 22px var(--glow); }
  .btn-ghost { background: var(--bg); color: var(--ink); }
  .btn-ghost:hover { background: var(--line); }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-danger { background: #fbe9ec; color: #d6454c; }
  .btn-danger:hover { background: #f7d6db; }
  .stat { display: inline-flex; flex-direction: column; gap: 2px; background: var(--brand-soft); color: var(--brand); padding: 11px 18px; border-radius: 13px; margin: 0 12px 12px 0; }
  .stat .num { font-size: 23px; font-weight: 800; }
  .stat .lbl { font-size: 12px; opacity: .85; }
  .stat.green { background: #eaf2e7; color: var(--green); }
  .stat.amber { background: #fbf0e0; color: var(--amber); }
  .fast-clock { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 14px; }
  .fast-clock .big { font-size: 42px; font-weight: 800; color: var(--brand); letter-spacing: -1px; }
  .fast-clock .unit { font-size: 16px; color: var(--muted); }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 9px 18px; border-radius: 11px; background: var(--bg); color: var(--muted); cursor: pointer; font-weight: 700; font-size: 14px; transition: .15s; }
  .tab:hover { color: var(--ink); }
  .tab.active { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 5px 14px var(--glow); }
  /* ===== 日期导航（查看某一天） ===== */
  .date-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; background: var(--brand-soft); border: 1px solid var(--line); border-radius: 13px; padding: 9px 12px; }
  .date-nav button { padding: 7px 13px; font-size: 15px; background: var(--card); color: var(--ink); box-shadow: none; }
  .date-nav button:hover { background: var(--line); }
  .date-nav .dn-center { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .date-nav input[type=date] { width: auto; padding: 7px 10px; font-size: 13px; }
  .date-nav .dn-label { font-weight: 800; color: var(--brand); font-size: 14px; white-space: nowrap; }
  .date-nav .dn-today { margin-left: 4px; }
  .cat-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 7px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 13px 15px; background: var(--tint); border: 1px solid var(--line); border-radius: 13px; transition: .15s; }
  .item:hover { border-color: var(--brand); }
  .item .info { flex: 1; min-width: 0; }
  .item .title { font-weight: 700; }
  .item .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .item .kcal { color: var(--amber); font-weight: 700; }
  .item .acts { display: flex; gap: 6px; align-items: center; flex-shrink: 0; margin-left: auto; }
  .item .acts button { white-space: nowrap; }
  .btn-primary.editing { background: linear-gradient(135deg, #e0894a, #cf6a32); }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 26px 0; }
  .shop-item-wrap { border: 1px solid var(--line); border-radius: 13px; overflow: hidden; background: var(--tint); }
  .shop-item-wrap.done { opacity: .65; }
  .shop-item { border: none; border-radius: 0; background: transparent; gap: 12px; }
  .shop-item-wrap.done .text { text-decoration: line-through; color: var(--muted); }
  .shop-item .text { flex: 1; font-size: 15px; }
  .shop-sub { display: flex; gap: 6px 10px; padding: 8px 12px; border-top: 1px dashed var(--line); flex-wrap: wrap; align-items: flex-end; }
  .sub-field { flex: 1 1 110px; min-width: 100px; display: flex; flex-direction: column; }
  .sub-field label { font-size: 11px; margin-bottom: 2px; }
  .sub-field input { font-size: 12px; padding: 5px 8px; }
  .cat-tag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 20px; font-size: 11px; background: var(--brand); color: #fff; vertical-align: middle; }
  .progress { height: 9px; background: var(--line); border-radius: 20px; overflow: hidden; margin: 4px 0 16px; }
  .progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), #9bb98f); width: 0; transition: .3s; }
  .mood-row, .weather-row { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { width: 54px; height: 62px; border-radius: 13px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-size: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: .15s; }
  .chip:hover { transform: translateY(-2px); }
  .chip.sel { border-color: var(--brand); background: var(--brand-soft); }
  .chip .lbl { position: static; font-size: 10px; color: var(--muted); line-height: 1.1; }
  .picker-row { margin-bottom: 4px; }
  .diary-card { background: linear-gradient(180deg, #fffaf3, #fff); border: 1px solid #f0e4d6; flex-direction: column; align-items: stretch; }
  .diary-line { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; flex-wrap: wrap; }
  .diary-line .d-text { white-space: pre-wrap; line-height: 1.7; font-size: 14px; color: #4a423a; }
  .hb-photo { width: 66px; height: 66px; border-radius: 11px; object-fit: cover; cursor: pointer; flex-shrink: 0; background: var(--line); }
  .hb-thumb { width: 66px; height: 66px; border-radius: 11px; background: var(--line); flex-shrink: 0; display: grid; place-items: center; color: var(--muted); font-size: 24px; }
  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 9px; }
  .week-cell { background: var(--tint); border: 1px solid var(--line); border-radius: 13px; padding: 9px; min-height: 132px; }
  .week-cell.today { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 6px 16px var(--glow); }
  .week-cell .wd { font-size: 12px; color: var(--muted); }
  .week-cell .wd.t { color: var(--brand); font-weight: 700; }
  .week-cell .dt { font-weight: 800; font-size: 13px; margin: 2px 0 9px; }
  .week-task { font-size: 12px; padding: 6px 8px; margin-bottom: 6px; background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--brand); border-radius: 9px; line-height: 1.4; }
  .week-task.done { text-decoration: line-through; color: var(--muted); opacity: .65; border-left-color: var(--green); }
  .week-task .t { color: var(--brand); font-weight: 700; }
  .week-task.done .t { color: var(--green); }
  /* ===== 手机底部导航 ===== */
  .bottom-nav { display: none; }
  @media (max-width: 980px) { .week-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px) {
    .sidebar { display: none; }
    .main { padding: 18px 15px 88px; }
    .sec-head h1 { font-size: 22px; }
    .week-grid { grid-template-columns: 1fr; }
    .bottom-nav {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,253,250,.96); backdrop-filter: blur(10px);
      border-top: 1px solid var(--line); padding: 7px 4px calc(7px + env(safe-area-inset-bottom));
      justify-content: flex-start; gap: 2px; overflow-x: auto; z-index: 60; box-shadow: 0 -4px 18px rgba(120,90,60,.10);
      scrollbar-width: none;
    }
    .bottom-nav::-webkit-scrollbar { display: none; }
    .bottom-nav button {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: none; border: none; font-size: 10px; color: var(--muted);
      cursor: pointer; padding: 4px 2px; flex: 0 0 auto; min-width: 58px; font-weight: 600; font-family: inherit;
    }
    .bottom-nav button span { font-size: 21px; }
    .bottom-nav button.active { color: var(--brand); }
    .bottom-nav button.active span { transform: translateY(-1px); }
  }
  /* ===== 断食计时器 ===== */
  .timer-phase { display: inline-block; font-weight: 700; padding: 4px 12px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-size: 14px; }
  .timer-phase.fasting { background: #fdecec; color: #d9534f; }
  .timer-phase.eating { background: #e9f4ec; color: #2e9e5b; }
  .timer-phase.eating { background: #eaf3e8; color: var(--green); }
  .timer-big { font-size: 46px; font-weight: 800; letter-spacing: 1px; margin: 8px 0 4px; font-variant-numeric: tabular-nums; }
  .timer-sub { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  /* ===== 学习重复 ===== */
  .repeat-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 14px; }
  .repeat-row .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .rchip { border: 1px solid var(--line); background: #fff; color: var(--muted); border-radius: 99px; padding: 5px 12px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .rchip.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  /* ===== 图标 ===== */
  .logo img { width: 34px; height: 26px; border-radius: 8px; object-fit: cover; }
  .icon-upload { margin-top: 8px; font-size: 12px; background: var(--brand-soft); color: var(--brand); border: none; border-radius: 99px; padding: 5px 12px; cursor: pointer; font-family: inherit; }
  .home-hero { padding: 18px 0 6px; }
  .home-hero-top { display: flex; align-items: center; gap: 16px; }
  .home-avatar { width: 64px; height: 64px; border-radius: 22px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); display: grid; place-items: center; font-size: 34px; box-shadow: 0 8px 18px var(--glow); flex-shrink: 0; overflow: hidden; }
  .home-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .home-greet .greet { font-size: 15px; color: var(--muted); }
  .home-greet .date-big { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
  .home-greet .date-sub { font-size: 13px; color: var(--brand); font-weight: 700; }
  .quote-card { margin: 28px 0 16px; padding: 14px 44px 14px 18px; background: var(--soft); border-left: 4px solid var(--brand); border-radius: 14px; font-size: 15px; color: var(--ink); line-height: 1.6; position: relative; }
  .quote-card::before { content: '💡'; position: absolute; top: -10px; left: 12px; font-size: 18px; background: var(--card); padding: 0 4px; border-radius: 8px; }
  .quote-refresh { position: absolute; top: 8px; right: 8px; border: none; background: transparent; font-size: 16px; cursor: pointer; opacity: .5; padding: 4px; border-radius: 8px; transition: .15s; }
  .quote-refresh:hover { opacity: 1; background: var(--card); transform: rotate(90deg); }
  .dogs { margin: 6px 0 4px; }
  .dogs-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
  .dog-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .dog { display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); width: 96px; }
  .dog-face { width: 60px; height: 60px; }
  .dog-name { font-size: 13px; font-weight: 700; color: var(--brand); }
  .ts-label { font-size: 14px; font-weight: 700; color: var(--ink); }
  .ts-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .ts-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 99px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit; transition: .15s; }
  .ts-chip .dot { width: 12px; height: 12px; border-radius: 50%; }
  .ts-chip.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  /* ===== 导航小狗图标 ===== */
  .emoji svg, .bottom-nav button > span svg { width: 22px; height: 22px; display: block; }
  .logo svg, .home-avatar svg { width: 100%; height: 100%; display: block; }
  .sec-icon svg { width: 30px; height: 30px; vertical-align: middle; margin-right: 8px; display: inline-block; }
  /* ===== 首页：时钟 / 天气 / 计时器 ===== */
  .home-clock { margin-left: auto; text-align: right; flex-shrink: 0; }
  .home-clock .clock-time { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; color: var(--brand); }
  .home-clock .clock-label { font-size: 12px; color: var(--muted); }
  .home-weather { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin: 14px 0 2px; }
  .home-weather .w-label { font-size: 14px; font-weight: 700; color: var(--ink); }
  .w-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
  .w-chip { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 4px; font-size: 20px; cursor: pointer; line-height: 1; transition: .15s; text-align: center; }
  .w-chip.active { background: var(--brand-soft); border-color: var(--brand); transform: scale(1.08); }
  .timer-card { margin: 14px 0 8px; padding: 14px 16px; background: var(--brand-soft); border-radius: 16px; }
  .timer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .timer-title { font-size: 16px; font-weight: 800; color: var(--ink); }
  .timer-add { display: flex; gap: 8px; flex: 1; min-width: 200px; }
  .timer-add input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font-size: 14px; }
  .timer-item.running .tm-time { color: var(--brand); }
  .timer-item:not(.running) .tm-time { color: var(--muted); }
  .tm-time { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; margin-top: 2px; }
  /* ===== 运势 / 日历 ===== */
  .fortune-date { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 4px 0 2px; }
  .fortune-date .big { font-size: 30px; font-weight: 800; }
  .fortune-date .wd { font-size: 16px; color: var(--brand); font-weight: 700; }
  .fortune-date .sub { font-size: 13px; color: var(--muted); }
  /* ===== 生理期日历 ===== */
  .period-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .period-status { font-size: 13px; color: var(--muted); margin-left: 4px; }
  .period-summary { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  .period-summary .ps { background: var(--soft); border-radius: 12px; padding: 8px 12px; font-size: 13px; color: var(--ink); }
  .period-summary .ps b { color: var(--brand); font-size: 16px; margin: 0 2px; }
  .cal-nav { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; }
  .cal-title { font-weight: 800; font-size: 15px; margin-right: auto; }
  .cal-arrow { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); font-size: 18px; cursor: pointer; line-height: 1; }
  .cal-arrow:active { transform: scale(.92); }
